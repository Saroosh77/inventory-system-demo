name: Refresh demo data

# The demo signs visitors in as an administrator, so they can edit and delete
# records. This restores the data set every day so the demo cannot degrade.
#
# Requires three repository secrets:
#   DEMO_DATABASE_URL  — pooled connection string for the DEMO database only.
#                        Never point this at anything but the demo instance:
#                        the seed truncates every table before it writes.
#   DEMO_DIRECT_URL    — non-pooled connection string for the same database
#                        (migrations need a direct connection; the pooler
#                        doesn't support the session locks `migrate deploy`
#                        requires).
#   DEMO_USER_PASSWORD — password assigned to the three demo accounts.

on:
  schedule:
    # 02:00 UTC daily.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  reseed:
    name: Re-seed the demo database
    runs-on: ubuntu-latest
    # Guards against a fork or a misconfigured environment running a
    # destructive job with no target.
    if: github.repository_owner != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply any pending migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEMO_DIRECT_URL }}

      - name: Reload demo data
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DEMO_DIRECT_URL }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
